# TODO: Prometheus scrape config targeting http://api:8080/metrics
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"

    static_configs:
      - targets:
          - "prometheus:9090"

  - job_name: "fastapi"

    static_configs:
      - targets:
          - "api:8080"

  - job_name: "node"

    static_configs:
      - targets:
          - "node-exporter:9100"
